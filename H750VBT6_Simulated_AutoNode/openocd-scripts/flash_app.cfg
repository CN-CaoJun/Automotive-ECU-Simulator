init
source [file join [pwd] qspi_init.tcl]

# The OpenOCD program helper performs "reset init" internally. Reinitialize
# QUADSPI after every reset so its indirect-mode commands reach the flash.
$_CHIPNAME.cpu0 configure -event reset-init {
    qspi_prepare
}

reset init
flash probe 1
program "../build-app/Simulated-GW-ECU.bin" verify 0x90000000
reset run
shutdown
